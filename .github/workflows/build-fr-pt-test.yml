name: Build FR PT EPG test
on:
  workflow_dispatch:
  push:
    paths:
      - "build_fr_pt_test.py"
      - ".github/workflows/build-fr-pt-test.yml"
  schedule:
    - cron: "20 5 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate test guide
        run: python build_fr_pt_test.py
      - name: Publish test guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg-fr-pt-test.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "Refresh FR PT test EPG"
            git push
          fi
