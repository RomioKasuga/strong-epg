
name: Update Strong EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, merge and compress EPG
        run: python merge_epg_strong.py

      - name: Validate compressed XML
        run: |
          python -c "import gzip, xml.etree.ElementTree as ET; f = gzip.open('epg.xml.gz', 'rb'); root = ET.parse(f).getroot(); f.close(); assert root.tag == 'tv'; print('XMLTV GZIP valide')"

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz
          if git diff --cached --quiet; then
            echo "Aucune modification EPG."
          else
            git commit -m "Auto-update compressed EPG"
            git push
          fi
