
name: Update Strong EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and merge EPG
        run: python merge_epg.py

      - name: Validate generated XML
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('epg.xml'); print('XML valide')"

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if git diff --cached --quiet; then
            echo "Aucune modification EPG."
          else
            git commit -m "Auto-update EPG"
            git push
          fi
